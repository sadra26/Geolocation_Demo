<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location Tracking</title>
  </head>
  <body>
    <h1>Location Tracking Demo</h1>

    <button id="find-me">Show my location</button><br />
    <p id="address"></p>
    <a id="map-link" href="" target="_blank">Location unknown</a>

    <script>
      navigator.geolocation.getCurrentPosition(async (position) => {
        console.log(position.coords.latitude);
        console.log(position.coords.longitude);
      });

      document.getElementById("find-me").addEventListener("click", () => {
        // const status = document.getElementById("status");
        // const mapLink = document.getElementById("map-link");


        navigator.geolocation.getCurrentPosition(async (position) => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}`);

          const data = await response.json();

          console.log(data);

          const address = data.address.town + ", " + data.address.county + ", " + data.address.state + ", " + data.address.country;

          document.getElementById("address").textContent = address;

          alert("location access granted");
        },
    
        (error) => {
          alert("must allow location access to use this feature");
        }
        );
      });
    </script>
  </body>
</html>
